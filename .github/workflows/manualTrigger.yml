name: Manual Deploy

on: 
  workflow_dispatch:
    inputs:
      enviroment:
        description: 'Target enviroment'
        required: true
        default: 'staging'
        type: choice
        options: 
          - staging 
          - production

jobs:
 deploy: 
  runs-on: ubuntu-latest
  steps: 
    - name: Deploy to environment
      run: echo "Deploying to ${{ github.event.inputs.environment }}"
      